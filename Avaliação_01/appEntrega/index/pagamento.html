<!-- pagamento.html: fragmento da TELA PAGAMENTO -->
<div id="pagamentoScreen" class="screen">
  <div class="header-back">
    <button id="btnVoltarPagamento" class="btn-back">← Voltar</button>
    <div class="title-large">COBRAR CLIENTE</div>
  </div>

  <div class="product-summary">
    <div class="summary-icon" id="iconeProdutoPag">🔵</div>
    <div class="summary-nome" id="nomeProdutoPag">Botijão P13</div>
    <div class="summary-preco" id="precoProdutoPag">R$ 120,00</div>
    <div class="summary-hint">Mostre para o cliente conferir</div>
  </div>

  <div class="spacer"></div>

  <div class="thumb-zone">
    <div class="payment-label">FORMA DE PAGAMENTO</div>
    <button id="btnPix" class="btn-pagamento btn-pix">
      <span class="btn-icon">📱</span> PIX
    </button>
    <div class="pagamento-row">
      <button id="btnDinheiro" class="btn-pagamento btn-pagamento-alt">
        <span class="btn-icon">💵</span>
        <span>Dinheiro</span>
      </button>
      <button id="btnCartao" class="btn-pagamento btn-pagamento-alt">
        <span class="btn-icon">💳</span>
        <span>Cartão</span>
      </button>
    </div>
  </div>
</div>
