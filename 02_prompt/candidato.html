<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Plataforma de Vagas — Perfil do Candidato</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- POR QUE: header identifica a aplicação e facilita navegação. Use `header` por seu papel semântico. -->
<header class="cabecalho">
  <h1>Plataforma de Vagas</h1>
  <!-- DECISAO SUA: mostrar menu completo ou apenas links essenciais?
       Coloquei links mínimos (Vagas / Perfil). Ajuste conforme preferir. -->
  <nav class="navegacao">
    <a href="#" class="link">Vagas</a>
    <a href="#" class="link">Perfil</a>
  </nav>
</header>

<main class="conteudo-principal">
  <section class="perfil-candidato">
    <!-- POR QUE: seção separa as informações do candidato do restante da página. -->
    <h2>Seu perfil</h2>
    <p class="nome-candidato"><strong>Nome do Candidato</strong></p>

    <!-- COMPLETAR: coloque aqui o resumo profissional do candidato (1-2 linhas) -->
     <p>Profissional extremante vagabundo!</p>

    <!-- POR QUE: usar uma lista para habilidades torna a informação escaneável. -->
    <h3>Habilidades principais</h3>
    <ul class="habilidades">
      <li></li>
      <li></li>
      <li></li>
    </ul>

    <p class="experiencia">
      <!-- DECISAO SUA: mostrar anos de experiência ou apenas cargo atual?
           Coloquei ambos como opções para você preencher. -->
      <strong>Cargo atual:</strong> <!-- COMPLETAR: cargo atual --> <br>
      <strong>Anos de experiência:</strong> <!-- COMPLETAR: anos de experiência -->
    </p>
  </section>

  <section class="busca-vagas">
    <!-- POR QUE: form permite busca sem JavaScript, mantendo acessibilidade. -->
    <h2>Buscar vagas</h2>
    <form class="form-busca" action="#" method="get">
      <label for="termo">Palavra-chave</label>
      <input type="text" id="termo" name="termo" placeholder="ex: desenvolvedor front-end">

      <label for="local">Localidade</label>
      <select id="local" name="local">
        <option value="">Qualquer</option>
        <option value="sp">São Paulo</option>
        <option value="rj">Rio de Janeiro</option>
      </select>

      <button type="submit" class="botao-principal">Buscar</button>
    </form>
  </section>

  <section class="candidaturas-recentes">
    <h2>Candidaturas recentes</h2>
    <!-- POR QUE: lista simples para histórico de candidaturas, fácil de preencher manualmente. -->
    <ul>
      <!-- COMPLETAR: listar as últimas candidaturas do candidato -->
    </ul>
  </section>
</main>

<footer class="rodape">
  <p>© Plataforma de Vagas</p>
  <!-- DECISAO SUA: se quiser incluir ano, preencha à mão (sem JS aqui). -->
</footer>

</body>
</html>
